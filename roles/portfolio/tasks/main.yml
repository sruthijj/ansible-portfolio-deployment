
---
- name: Update package repository
  apt:
    update_cache: yes

- name: Install Nginx
  apt:
    name: nginx
    state: present

- name: Copy portfolio website files
  copy:
    src: "{{ item }}"
    dest: /var/www/html/
    owner: www-data
    group: www-data
    mode: '0644'
  loop:
    - index.html
    - about.html
    - projects.html
    - contact.html
    - style.css

- name: Start and enable Nginx
  service:
    name: nginx
    state: started
    enabled: yes
